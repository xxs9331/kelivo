name: Kelivo Sync Test
on:
  workflow_dispatch:
  push:
    branches: [feature/device-sync]
permissions:
  contents: read
concurrency:
  group: device-sync-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race ./...
        working-directory: server
      - run: go vet ./...
        working-directory: server
  windows:
    needs: server
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=KELIVO_SYNC_TEST=true
      - uses: actions/upload-artifact@v4
        with:
          name: kelivo-sync-test-windows
          path: build/windows/x64/runner/Release/
          retention-days: 14
  android:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-arm64 --dart-define=KELIVO_SYNC_TEST=true
      - uses: actions/upload-artifact@v4
        with:
          name: kelivo-sync-test-android
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
